<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
 <title id="title">胸托哑铃划船动作示意</title><desc id="desc">侧视人物俯卧在上斜凳上，胸部贴靠凳面、双脚支撑地面。实线表示弯肘将哑铃拉向身侧，虚线表示哑铃下放到手臂伸展位置，金箭头向后上方表示拉起路径。</desc>
