  </g>
  <g text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"><text x="310" y="35" fill="#D7B781" font-size="10" letter-spacing="3.8">CORE &amp; ABDOMINAL WALL</text><path d="M264 49H356" stroke="#D7B781" stroke-opacity=".3"/><text x="310" y="614" fill="#B3B99F" font-size="10.5">核心还包括背侧肌群等结构；本图重点展示腹壁层次</text><text x="310" y="635" fill="#8F9D88" font-size="10">前面观 + 深层窗口 · 教学示意，非医学比例图</text></g>
