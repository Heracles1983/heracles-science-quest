<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" fill="none" role="img" aria-labelledby="core-title core-desc">
  <title id="core-title">核心腹壁解剖：腹直肌、腹外斜肌、腹内斜肌与深层腹横肌</title>
  <desc id="core-desc">躯干前面观。金铜色腹直肌在腹白线两侧，酒红色腹外斜肌分布于两侧；左下小窗口移除腹外斜肌以展示腹内斜肌。右下独立深层窗口移除腹外斜肌和腹内斜肌，展示横向纤维的腹横肌。核心还包括图中未完整呈现的背侧肌群、膈肌和盆底。</desc>
