<path d="M266 94Q287 84 308 100L311 150Q293 167 271 151Z" fill="url(#body)"/>
<path d="M271 124 308 128 308 151Q287 161 273 148Z" fill="#b88055"/><path d="M279 127 279 150M290 129 290 153M301 129 301 150" stroke="#e1bc89" stroke-opacity=".5"/>
<path d="M289 83 289 95" class="bone" stroke-width="10"/><circle cx="289" cy="66" r="17" fill="url(#body)"/><path d="M278 53Q290 47 302 59" stroke="#6c7868" stroke-width="4" fill="none"/>
<path d="M270 104 285 137 324 131M308 106 330 116 325 131" class="bone" stroke-width="9"/>
<path d="M270 104 329 121 394 128M308 106 351 117 394 128" class="ghost"/>
<path d="M340 97 388 105" class="path"/><path d="M198 91 157 89" class="path"/>
<text x="87" y="82" class="note">侧向拉力</text><text x="351" y="79" class="note">双手推出、收回</text>
<text x="390" y="181" text-anchor="middle" class="note">胸廓与骨盆朝前</text><path d="M384 168 312 148" stroke="#bca16b" opacity=".45"/>
<text x="260" y="252" text-anchor="middle" class="note">锚点牢固 · 抵抗转体而非主动扭转 · 两侧都练</text>

