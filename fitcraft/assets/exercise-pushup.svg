<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
  <title id="title">俯卧撑动作示意</title>
  <desc id="desc">侧视人物以双手和脚尖支撑地面。实线表示撑起位置，虚线表示屈肘下降位置。头、躯干和腿保持整体稳定，金色弧线表示下降与推起。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#d4b674" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="body" x1="0" x2="1" y2="1"><stop stop-color="#f0e6cf"/><stop offset="1" stop-color="#bdc0ac"/></linearGradient>
  </defs>
  <style>.bone{fill:none;stroke:#e8dfca;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#e8dfca;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;opacity:.4}.note{fill:#b8c0ac;font:10px system-ui,sans-serif;letter-spacing:1px}.path{fill:none;stroke:#d4b674;stroke-width:1.7;stroke-linecap:round;marker-end:url(#arrow)}@media(prefers-reduced-motion:no-preference){.path{stroke-dasharray:4 5;animation:flow 2.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-18}}}</style>
  <text x="24" y="28" fill="#e9e2cc" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">俯卧撑</text>
  <text x="496" y="28" text-anchor="end" class="note" opacity=".65">侧面视角</text>
  <path d="M77 216H454" stroke="#bca16b" stroke-width="2" opacity=".55"/>
  <g class="ghost"><path d="M172 144 187 150 294 170 422 186"/><circle cx="155" cy="139" r="15"/><path d="M186 151 223 183 190 207"/></g>
  <path d="M285 131 352 156 421 183" class="bone" stroke-width="17"/>
  <path d="M288 140 351 165 420 190" fill="none" stroke="#c2c5b0" stroke-width="10" stroke-linecap="round"/>
  <path d="M420 184 432 207 417 211" fill="none" stroke="#e8dfca" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M176 94 187 100" class="bone" stroke-width="12"/>
  <path d="M184 91Q199 87 220 102L292 128Q305 134 296 145L211 121Q191 117 181 107Z" fill="url(#body)"/>
  <path d="M188 95Q206 95 230 108L224 121 197 113Z" fill="#9e5260"/>
  <path d="M194 98 221 112M191 102 218 115" stroke="#d59b9c" stroke-width="1" opacity=".45"/>
  <circle cx="157" cy="87" r="16" fill="url(#body)"/>
  <path d="M144 92 139 99 146 100" fill="#e8dfca"/>
  <path d="M146 77Q160 66 170 81" fill="none" stroke="#6c7868" stroke-width="4" stroke-linecap="round"/>
  <path d="M190 106 193 156 189 205" class="bone"/>
  <circle cx="193" cy="156" r="4" fill="#a5ad97"/>
  <path d="M188 210H168" stroke="#e8dfca" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 104Q107 126 120 151" class="path"/>
  <path d="M242 169Q259 148 250 122" class="path" opacity=".75"/>
  <text x="70" y="176" class="note">控制下降</text>
  <path d="M235 80 356 123" fill="none" stroke="#bca16b" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>
  <text x="326" y="79" class="note">躯干保持稳定</text>
  <path d="M334 87 324 111" fill="none" stroke="#bca16b" opacity=".5"/>
  <text x="260" y="252" text-anchor="middle" class="note">动作路径示意 · 以舒适可控的幅度练习</text>
</svg>
