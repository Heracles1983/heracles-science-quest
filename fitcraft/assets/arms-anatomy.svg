  <path d="M126 126Q156 105 193 116Q222 125 234 157L237 212Q247 280 228 361L214 408Q225 447 216 495L206 547Q207 565 197 581L188 595Q180 600 175 591L176 578Q161 593 154 585L158 569Q143 578 139 568L153 542L157 486Q149 441 157 407L141 366Q121 317 126 252L119 197Q104 156 126 126Z" fill="url(#arm-skin)" stroke="#859175" stroke-opacity=".5" stroke-width="1.3"/>
  <path d="M121 183Q125 153 147 139Q166 122 193 124Q219 140 225 169L216 221Q197 235 179 224Q145 215 121 183Z" fill="#657154" stroke="#A4AD86" stroke-opacity=".3"/>
