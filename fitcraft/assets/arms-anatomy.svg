<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" fill="none" role="img" aria-labelledby="arms-title arms-desc">
  <title id="arms-title">上臂肌群解剖：前面观与后面观</title>
  <desc id="arms-desc">左图为上臂前面观，金色肱二头肌覆盖大部分肱肌，绿色肱肌从其下段两侧露出，虚线示意深层轮廓。右图为上臂后面观，铜红色肱三头肌分长头、外侧头和部分露出的内侧头，汇向肘后尺骨鹰嘴。前后两图均带中文引线标签，可选择三个肌群。</desc>
  <defs>
    <linearGradient id="arm-skin" x1="80" y1="125" x2="500" y2="550" gradientUnits="userSpaceOnUse"><stop stop-color="#66705A"/><stop offset=".5" stop-color="#3B4B3C"/><stop offset="1" stop-color="#26372D"/></linearGradient>
    <linearGradient id="arm-biceps" x1="153" y1="190" x2="222" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#D9B17D"/><stop offset=".55" stop-color="#BA8759"/><stop offset="1" stop-color="#805134"/></linearGradient>
    <linearGradient id="arm-brachialis" x1="135" y1="280" x2="227" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#A7BC95"/><stop offset="1" stop-color="#5D8066"/></linearGradient>
    <linearGradient id="arm-triceps" x1="375" y1="180" x2="472" y2="405" gradientUnits="userSpaceOnUse"><stop stop-color="#CC9476"/><stop offset=".5" stop-color="#A86454"/><stop offset="1" stop-color="#6C3C37"/></linearGradient>
    <linearGradient id="arm-bone"><stop stop-color="#DBD1A9"/><stop offset="1" stop-color="#989E7B"/></linearGradient>
    <g id="arm-fibres" stroke="#EED2A6" stroke-width="1.1" stroke-opacity=".36"><path d="M163 225C146 272 163 330 180 367M173 210C159 263 173 325 185 371M183 214C175 273 183 328 189 370M195 211C202 263 198 328 193 372M205 223C220 278 207 329 198 365"/></g>
  </defs>
  <g stroke="#D7B781" stroke-opacity=".055"><path d="M70 80V578M150 80V578M230 80V578M390 80V578M470 80V578M550 80V578"/><path d="M38 130H582M38 210H582M38 290H582M38 370H582M38 450H582M38 530H582"/></g>
  <path d="M310 90V589" stroke="#D7B781" stroke-opacity=".13" stroke-dasharray="3 7"/>
