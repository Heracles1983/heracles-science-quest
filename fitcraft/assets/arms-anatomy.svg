    <title>肱三头肌：三个头汇向尺骨鹰嘴，参与伸肘；长头跨过肩关节</title>
    <!-- Long head lies medially; outer head lies laterally; distal medial head is exposed. -->
    <path d="M405 179Q391 204 391 242Q389 290 405 333L430 389Q439 373 438 344L425 268Q421 215 417 185" fill="url(#arm-triceps)" stroke="#DEA98B" stroke-width="1.3"/>
