    <text x="321" y="466" fill="#DCCBB1" font-size="11">尺骨鹰嘴</text>
    <text x="27" y="511" fill="#C9CEB5" font-size="10">屈肘 / 旋后</text><text x="495" y="511" fill="#C9CEB5" font-size="10">伸肘</text>
  </g>
