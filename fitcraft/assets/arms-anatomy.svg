    <path d="M172 167L173 193M194 169L190 190" stroke="#D7C29A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M157 409Q178 399 213 408" stroke="#C9C5A1" stroke-opacity=".35" stroke-width="1.2"/>
