    <g stroke="#EDB499" stroke-opacity=".4" stroke-width="1.1"><path d="M407 201Q396 253 416 318L433 376M414 211Q408 261 426 326M451 226Q441 260 441 295Q442 337 432 374M463 233Q462 281 445 331M472 247Q472 289 447 340M412 352L430 391M459 357L438 395"/></g>
    <path d="M430 375L427 405Q432 414 440 407L442 383" fill="#C9BD98" stroke="#DDD1A8" stroke-opacity=".8"/>
    <path d="M410 182L414 207" stroke="#D4C09A" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M414 416Q405 450 419 491L419 546M447 415Q461 452 451 496L440 548M405 544L446 555" stroke="#ACB591" stroke-opacity=".3" stroke-width="1.2"/>
  <path d="M424 411Q431 417 440 410" stroke="#CDC6A0" stroke-width="3" stroke-linecap="round"/>
  <!-- Labels remain outside the muscle silhouettes. -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="24" y="231" fill="#F0E6D4" font-size="16" font-weight="600">肱二头肌</text><text x="24" y="250" fill="#C7B48F" font-size="9" letter-spacing="1">BICEPS BRACHII</text>
    <text x="23" y="376" fill="#F0E6D4" font-size="16" font-weight="600">肱肌</text><text x="23" y="395" fill="#B3C4A3" font-size="9" letter-spacing="1">BRACHIALIS</text>
    <text x="23" y="415" fill="#ABB79C" font-size="10">多数位于深层</text>
    <text x="491" y="261" fill="#F0E6D4" font-size="16" font-weight="600">肱三头肌</text><text x="491" y="279" fill="#C7AB91" font-size="8.5" letter-spacing=".6">TRICEPS BRACHII</text>
