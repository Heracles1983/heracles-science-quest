    <text x="310" y="34" fill="#D7B781" font-size="11" letter-spacing="3.4">UPPER ARM ANATOMY</text>
    <path d="M260 49H360" stroke="#D7B781" stroke-opacity=".3"/>
    <text x="184" y="80" fill="#E9E0C9" font-size="15" letter-spacing="3">前面观</text><text x="432" y="80" fill="#E9E0C9" font-size="15" letter-spacing="3">后面观</text>
  </g>
