<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
 <title id="title">绳索直臂下压动作示意</title><desc id="desc">侧视人物站在高位绳索前，髋膝略屈，实线为上臂下压到躯干旁，虚线为上臂回到前上方。肘角相对稳定，金箭头表示通过肩伸下压的弧线。</desc>
