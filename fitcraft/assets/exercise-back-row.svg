<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
 <title id="title">坐姿绳索划船动作示意</title><desc id="desc">侧视人物坐在凳上面对低位绳索，实线为把手拉回躯干旁，虚线为手臂向前回程位置。金箭头向躯干表示水平拉动，腰背保持稳定。</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#d4b674" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
 <style>.body{fill:none;stroke:#e8dfca;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#e8dfca;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;opacity:.4}.equipment{fill:none;stroke:#bca16b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.note{fill:#b8c0ac;font:10px system-ui,sans-serif;letter-spacing:.7px}.path{fill:none;stroke:#d4b674;stroke-width:1.8;marker-end:url(#arrow)}</style>
 <text x="24" y="28" fill="#e9e2cc" font-size="12" font-family="system-ui,sans-serif" letter-spacing="2">坐姿绳索划船</text><text x="496" y="28" text-anchor="end" class="note" opacity=".65">侧面视角</text>
