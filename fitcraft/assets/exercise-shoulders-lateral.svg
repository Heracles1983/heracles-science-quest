<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
  <title id="title">哑铃侧平举</title><desc id="desc">正面站立人物，实线为双臂位于身体两侧的起始位置，虚线为双臂向两侧抬起的位置，肘部轻弯。金色箭头表示向侧方抬臂，示意终点不是必须达到的固定高度。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#D7B781" stroke-width="1.6"/></marker></defs>
  <style>.bone{fill:none;stroke:#E8DFCA;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#E8DFCA;stroke-width:4;stroke-dasharray:5 5;opacity:.45;stroke-linecap:round;stroke-linejoin:round}.equipment{fill:none;stroke:#BCA16B;stroke-width:4;stroke-linecap:round}.note{fill:#B8C0AC;font:10px system-ui,sans-serif}.path{fill:none;stroke:#D7B781;stroke-width:1.7;marker-end:url(#arrow)}</style>
  <text x="24" y="28" fill="#E9E2CC" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">哑铃侧平举</text><text x="496" y="28" text-anchor="end" class="note">正面 · 两个位置</text>
