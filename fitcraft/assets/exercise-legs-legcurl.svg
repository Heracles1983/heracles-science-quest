<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-labelledby="title desc"><title id="title">器械坐姿屈腿动作示意</title><desc id="desc">侧面人物坐在屈腿机上。虚线展示小腿较伸展的起始位置，实线展示膝关节弯曲的完成位置，圆点提示器械转轴与膝关节尽量对齐，脚垫接触小腿下段。箭头表示脚跟向身体方向移动。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#D4B674" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="body" x1="0" x2="1" y2="1"><stop stop-color="#F0E6CF"/><stop offset="1" stop-color="#BBC1A9"/></linearGradient></defs><style>.limb{fill:none;stroke:#E8DFCA;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.trunk{fill:none;stroke:#D5D7BE;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}.equipment{fill:none;stroke:#BCA16B;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.note{fill:#B8C0AC;font:10px system-ui,sans-serif;letter-spacing:.5px}.path{fill:none;stroke:#D4B674;stroke-width:1.7;stroke-linecap:round;marker-end:url(#arrow)}.muscle{fill:none;stroke:#B88760;stroke-width:7;stroke-linecap:round;opacity:.9}.joint{fill:#A5AD97}</style><text x="24" y="28" fill="#E9E2CC" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">器械坐姿屈腿</text><text x="496" y="28" text-anchor="end" class="note" opacity=".65">双位置 · 侧面视角</text><path d="M72 225H452" stroke="#C5B880" stroke-width="1" opacity=".25"/>
<g class="equipment"><path d="M123 91 147 156" stroke-width="9"/><path d="M149 166H242" stroke-width="9"/><path d="M155 172 143 220M218 174 231 220M132 220H158M219 220H245"/><path d="M240 157 251 203 295 214" stroke-width="3"/></g>
<circle cx="155" cy="65" r="14" fill="url(#body)"/><path d="M164 65 170 71 163 74" fill="#E8DFCA"/><path d="M160 93 178 149" class="trunk"/><path d="M175 149 239 155" class="limb" stroke-width="18"/><path d="M165 99 187 126 211 137" class="limb" stroke-width="9"/>
<path d="M239 155 310 148 329 150" fill="none" stroke="#E8DFCA" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 7" opacity=".5"/>
<path d="M239 155 254 203 272 213" class="limb" stroke-width="13"/><path d="M184 151 224 155" class="muscle"/>
<circle cx="239" cy="155" r="6" fill="#D4B674" stroke="#1F2D24" stroke-width="2"/><path d="M200 140 227 143" class="equipment" stroke-width="10"/><path d="M249 193 261 199" class="equipment" stroke-width="13"/><path d="M306 140 315 150" class="equipment" stroke-width="8" opacity=".45"/>
<path d="M328 172Q321 209 287 219" class="path"/>
<text x="336" y="91" class="note">起始：膝较伸展</text><path d="M334 98 313 139" stroke="#BCA16B" opacity=".5"/><text x="338" y="136" class="note">转轴对齐膝关节</text><path d="M330 140 249 155" stroke="#BCA16B" opacity=".5"/><text x="338" y="186" class="note">屈膝：脚跟向后</text><text x="74" y="196" class="note">固定大腿</text>
<text x="260" y="253" text-anchor="middle" class="note">依器械说明调节 · 固定躯干与大腿 · 屈膝和回程都受控</text></svg>