  <text x="367" y="89" class="note">躯干稳定</text><path d="M362 95L294 143" stroke="#BCA16B" opacity=".5"/>
  <text x="260" y="253" text-anchor="middle" class="note">实线：起始位 · 虚线：打开位 · 可用胸部支撑降低稳定难度</text>
