  <path d="M231 103Q260 93 289 103L278 171Q260 183 242 171Z" fill="#B9C0A9"/>
  <path d="M260 103V163M239 116L253 131M281 116L267 131" stroke="#71826A" stroke-width="1.3" opacity=".6"/>
  <circle cx="260" cy="78" r="16" fill="#E8DFCA"/><path d="M254 93V101H266V93" fill="#E8DFCA"/>
  <path d="M235 102Q224 101 222 113L234 124L244 107ZM285 102Q296 101 298 113L286 124L276 107Z" fill="#A96163"/>
  <path d="M232 113L235 143L246 169M288 113L285 143L274 169" class="bone"/>
  <g class="equipment"><path d="M236 177H256M264 177H284M236 170V184M242 168V186M250 168V186M256 170V184M264 170V184M270 168V186M278 168V186M284 170V184"/></g>
