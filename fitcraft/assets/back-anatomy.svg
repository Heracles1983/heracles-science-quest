<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" fill="none" role="img" aria-labelledby="back-title back-desc">
  <title id="back-title">背部肌群背面观：背阔肌、斜方肌与深层菱形肌</title>
  <desc id="back-desc">深绿人体背面观。红铜色背阔肌位于背部两侧下方；金铜色斜方肌从后颈展开至肩部并向胸椎下方收尖。右侧透明观察窗显示斜方肌深层、脊柱与肩胛骨内侧缘之间的菱形肌。三组肌肉可分别选择，中文引线标注。</desc>
