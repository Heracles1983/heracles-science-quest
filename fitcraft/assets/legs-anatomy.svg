<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" fill="none" role="img" aria-labelledby="title desc">
<title id="title">下肢肌群前后面观：股四头肌、腘绳肌、臀大肌与小腿后侧</title>
<desc id="desc">左侧为下肢前面观，大腿前侧金色区域为股四头肌。右侧为后面观，臀部铜色为臀大肌，大腿后侧酒红色为腘绳肌，小腿后侧绿色为腓肠肌，深层比目鱼肌仅作边缘提示。四个区域可分别选择。教学示意，非医学比例图。</desc>
