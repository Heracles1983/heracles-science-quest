<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
  <title id="title">平板哑铃卧推动作示意</title>
  <desc id="desc">侧视人物仰卧在平板凳上，双脚支撑地面。实线表示下降位置，虚线表示哑铃向胸部上方推起后的位置，金色箭头表示轨迹。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#d4b674" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="body" x1="0" x2="1" y2="1"><stop stop-color="#f0e6cf"/><stop offset="1" stop-color="#bdc0ac"/></linearGradient>
  </defs>
  <style>.bone{fill:none;stroke:#e8dfca;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#e8dfca;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;opacity:.4}.equipment{fill:none;stroke:#bca16b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.note{fill:#b8c0ac;font:10px system-ui,sans-serif;letter-spacing:1px}.path{fill:none;stroke:#d4b674;stroke-width:1.7;stroke-linecap:round;marker-end:url(#arrow)}@media(prefers-reduced-motion:no-preference){.path{stroke-dasharray:4 5;animation:flow 2.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-18}}}</style>
  <text x="24" y="28" fill="#e9e2cc" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">平板哑铃卧推</text>
  <text x="496" y="28" text-anchor="end" class="note" opacity=".65">侧面视角</text>
  <path d="M79 216H445" stroke="#c5b880" stroke-width="1" opacity=".22"/>
  <g class="equipment"><path d="M144 174H337" stroke-width="10"/><path d="M170 180 158 212M308 180 321 212M155 212H176M309 212H330"/></g>
  <path d="M282 150 332 166 354 207" class="bone" stroke-width="16"/>
  <path d="M292 153 346 170 384 207" class="bone" stroke-width="17"/>
  <path d="M349 210H369M379 210H401" stroke="#e8dfca" stroke-width="9" stroke-linecap="round"/>
  <path d="M183 145 195 144" class="bone" stroke-width="12"/>
  <path d="M195 135C216 129 240 135 253 140L289 145Q300 150 295 162H207Q193 160 195 135Z" fill="url(#body)"/>
  <path d="M203 137Q222 132 241 142L235 156 207 154Z" fill="#9e5260"/>
  <path d="M214 139 232 149M208 143 230 152" stroke="#d59b9c" stroke-width="1" opacity=".45"/>
  <circle cx="165" cy="146" r="16" fill="url(#body)"/>
  <path d="M151 140 148 147 153 149" fill="#e8dfca"/>
  <path d="M164 132Q176 132 177 143" fill="none" stroke="#6c7868" stroke-width="4" stroke-linecap="round"/>
  <path d="M216 142 256 154 262 100" class="bone"/>
  <circle cx="256" cy="154" r="4" fill="#a5ad97"/>
  <g class="equipment"><path d="M244 91H281"/><path d="M245 82V100M251 80V102M274 80V102M280 82V100" stroke-width="5"/></g>
  <path d="M216 141 224 89 231 46" class="ghost"/>
  <g class="equipment" opacity=".4" stroke-dasharray="3 4"><path d="M213 37H250"/><path d="M214 28V46M220 26V48M243 26V48M249 28V46" stroke-width="3"/></g>
  <path d="M294 91Q290 48 263 40" class="path"/>
  <path d="M204 51Q190 89 196 117" class="path" opacity=".6"/>
  <text x="324" y="75" class="note">向胸部上方推起</text>
  <path d="M316 82H298" stroke="#bca16b" opacity=".45"/>
  <text x="324" y="118" class="note">前臂接近竖直</text>
  <path d="M316 123H289L273 136" fill="none" stroke="#bca16b" opacity=".45"/>
  <text x="260" y="252" text-anchor="middle" class="note">动作路径示意 · 以舒适可控的幅度练习</text>
</svg>
