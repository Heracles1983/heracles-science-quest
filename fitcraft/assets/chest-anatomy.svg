      <stop stop-color="#53594B"/><stop offset=".45" stop-color="#313D33"/><stop offset="1" stop-color="#202C25"/>
    </linearGradient>
    <linearGradient id="neck-tone" x1="310" y1="70" x2="310" y2="196" gradientUnits="userSpaceOnUse">
