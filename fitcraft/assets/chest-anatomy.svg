<svg xmlns="http://www.w3.org/2000/svg" width="620" height="650" viewBox="0 0 620 650" fill="none" aria-labelledby="anatomy-title anatomy-desc" role="img">
  <title id="anatomy-title">胸大肌前面观：锁骨部、胸肋部与肱骨止点</title>
  <desc id="anatomy-desc">上半身前视解剖教学示意。胸大肌覆盖胸廓前方，金铜色的锁骨部与酒红色的胸肋部以扇形肌束汇向外侧上臂肱骨止点。中央细长结构为胸骨。可分别选择左右锁骨部和胸肋部。</desc>
