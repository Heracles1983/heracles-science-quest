<path d="M225 140H279" class="path"/><path d="M331 211V187" class="path"/><path d="M423 176V199" class="path"/><text x="284" y="165" class="note">脚跟上抬</text><text x="414" y="217" class="note">慢慢下降</text><circle cx="384" cy="223" r="3" fill="#D4B674"/>
<text x="260" y="253" text-anchor="middle" class="note">前脚掌保持支撑 · 先练平地幅度 · 不靠弹震完成</text></svg>