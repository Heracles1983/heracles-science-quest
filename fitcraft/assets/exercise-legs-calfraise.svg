<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270" role="img" aria-labelledby="title desc"><title id="title">扶稳站姿提踵动作示意</title><desc id="desc">两个侧面人物展示平地站立与脚跟抬起位置，人物扶住固定支撑。抬起脚跟时以前脚掌支撑，膝盖舒适伸展，不明显反张。箭头提示脚跟抬起与受控下降。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#D4B674" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="body" x1="0" x2="1" y2="1"><stop stop-color="#F0E6CF"/><stop offset="1" stop-color="#BBC1A9"/></linearGradient></defs><style>.limb{fill:none;stroke:#E8DFCA;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.trunk{fill:none;stroke:#D5D7BE;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}.equipment{fill:none;stroke:#BCA16B;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.note{fill:#B8C0AC;font:10px system-ui,sans-serif;letter-spacing:.5px}.path{fill:none;stroke:#D4B674;stroke-width:1.7;stroke-linecap:round;marker-end:url(#arrow)}.muscle{fill:none;stroke:#B88760;stroke-width:7;stroke-linecap:round;opacity:.9}.joint{fill:#A5AD97}</style><text x="24" y="28" fill="#E9E2CC" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">扶稳站姿提踵</text><text x="496" y="28" text-anchor="end" class="note" opacity=".65">双位置 · 侧面视角</text><path d="M72 225H452" stroke="#C5B880" stroke-width="1" opacity=".25"/>
<text x="147" y="44" text-anchor="middle" class="note">起始</text><text x="353" y="44" text-anchor="middle" class="note">抬起脚跟</text><g class="equipment" opacity=".6"><path d="M207 100V223M197 100H216M413 100V223M403 100H422"/></g>
<path d="M145 151 149 183 151 216M154 151 162 183 164 217" class="limb"/><path d="M148 150 148 101" class="trunk"/><circle cx="152" cy="75" r="14" fill="url(#body)"/><path d="M162 75 168 81 161 84" fill="#E8DFCA"/><path d="M151 105 178 123 205 112" class="limb" stroke-width="9"/><path d="M147 219H173M161 221H184" class="limb" stroke-width="7"/>
