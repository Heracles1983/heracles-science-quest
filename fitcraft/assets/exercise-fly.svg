<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img" aria-labelledby="title desc">
  <title id="title">哑铃飞鸟胸前合拢路径示意</title>
  <desc id="desc">仰卧人物的正面投影视图，胸大肌以酒红色标示。实线为双臂展开且肘部微屈的位置，虚线为双臂向胸前合拢的投影位置。金色弧线提示抱拢的动作。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#d4b674" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="body" x1="0" x2="1" y2="1"><stop stop-color="#f0e6cf"/><stop offset="1" stop-color="#bdc0ac"/></linearGradient>
  </defs>
  <style>.bone{fill:none;stroke:#e8dfca;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#e8dfca;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;opacity:.45}.equipment{fill:none;stroke:#bca16b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.note{fill:#b8c0ac;font:10px system-ui,sans-serif;letter-spacing:1px}.path{fill:none;stroke:#d4b674;stroke-width:1.7;stroke-linecap:round;marker-end:url(#arrow)}@media(prefers-reduced-motion:no-preference){.path{stroke-dasharray:4 5;animation:flow 2.8s linear infinite}@keyframes flow{to{stroke-dashoffset:-18}}}</style>
  <text x="24" y="28" fill="#e9e2cc" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">哑铃飞鸟</text>
  <text x="496" y="28" text-anchor="end" class="note" opacity=".65">仰卧 · 正面投影</text>
  <rect x="237" y="77" width="46" height="151" rx="13" fill="#bca16b" fill-opacity=".08" stroke="#bca16b" stroke-width="2" stroke-opacity=".4"/>
  <path d="M246 83V94M274 83V94" class="bone" stroke-width="11"/>
  <path d="M239 88Q260 95 281 88L307 101Q314 115 302 144L286 179 288 204Q260 217 232 204L234 179 218 144Q206 115 213 101Z" fill="url(#body)"/>
  <path d="M233 205 230 225M287 205 290 225" class="bone" stroke-width="21"/>
  <ellipse cx="260" cy="63" rx="17" ry="21" fill="url(#body)"/>
