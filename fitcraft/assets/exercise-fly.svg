  <path d="M304 104Q286 98 263 111L264 143Q283 151 299 132Z" fill="#9e5260"/>
  <path d="M224 108 252 117M222 115 253 125M227 127 252 134M296 108 268 117M298 115 267 125M293 127 268 134" stroke="#d59b9c" stroke-width="1" opacity=".45"/>
